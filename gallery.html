<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg-1: #07070a;
        --bg-2: #171117;
        --bg-3: #2d1c27;
        --rose: #ff6db7;
        --rose-soft: #ffd9ee;
        --gold: #ffc86d;
        --paper: #f6f0f2;
        --card: rgba(255, 255, 255, 0.06);
        --text: #fdf7fb;
        --muted: #ead5e2;
        --shadow: rgba(8, 7, 12, 0.35);
      }

      * { box-sizing: border-box; }

      html { scroll-behavior: smooth; }

      body {
        margin: 0;
        font-family: "Inter", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 12% 8%, rgba(255, 109, 183, 0.34), transparent 24%),
          radial-gradient(circle at 88% 12%, rgba(255, 200, 109, 0.18), transparent 18%),
          radial-gradient(circle at 50% 88%, rgba(255, 136, 190, 0.14), transparent 32%),
          linear-gradient(135deg, #050508 0%, #120d14 25%, #1a1219 60%, #21171d 100%);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(0,0,0,0.12));
        pointer-events: none;
      }

      a { color: inherit; text-decoration: none; }
      img { display: block; width: 100%; }

      .container {
        position: relative;
        z-index: 1;
        width: min(1180px, calc(100% - 28px));
        margin: 0 auto;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 10;
        backdrop-filter: blur(16px);
        background: rgba(12, 10, 15, 0.52);
        border-bottom: 1px solid rgba(255,255,255,0.08);
      }

      .nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        min-height: 76px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-size: 0.72rem;
      }

      .brand-mark {
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--rose), #ffb86e);
        box-shadow: 0 10px 22px rgba(255, 106, 173, 0.28);
      }

      .brand-mark::before {
        content: "❤";
        font-size: 0.9rem;
      }

      .nav-links {
        display: flex;
        align-items: center;
        gap: 26px;
        color: var(--muted);
      }

      .nav-links a {
        position: relative;
        font-size: 0.9rem;
      }

      .nav-links a::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: -8px;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, var(--rose), transparent);
        transform: scaleX(0);
        transition: transform 0.25s ease;
      }

      .nav-links a:hover::after,
      .nav-links a:focus-visible::after {
        transform: scaleX(1);
      }

      .top-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.8rem 1.2rem;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--rose), #ff84ba);
        color: white;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 0.74rem;
      }

      main {
        padding: 42px 0 90px;
      }

      .slideshow-shell {
        padding: 18px 18px 22px;
        border-radius: 34px;
        background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.016));
        border: 1px solid rgba(255,255,255,0.08);
        box-shadow: 0 30px 42px rgba(8, 7, 12, 0.26), inset 0 1px 0 rgba(255,255,255,0.08);
      }

      .slideshow {
        position: relative;
        height: 620px;
        border-radius: 30px;
        overflow: hidden;
        background: #120d14;
        border: 1px solid rgba(255,255,255,0.08);
        box-shadow: 0 36px 48px rgba(6, 5, 9, 0.34);
      }

      .slide {
        position: absolute;
        inset: 0;
        opacity: 0;
        transform: scale(1.08);
        transition: opacity 0.9s cubic-bezier(0.22, 1, 0.36, 1), transform 1.2s cubic-bezier(0.22, 1, 0.36, 1), filter 0.9s ease;
        filter: saturate(0.85) contrast(1.06) brightness(0.88);
      }

      .slide.active {
        opacity: 1;
        transform: scale(1);
        filter: saturate(1.08) contrast(1.12) brightness(1);
      }

      .slide img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: saturate(0.9) contrast(1.05) brightness(0.96);
      }

      .slide-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(12,10,15,0.12), rgba(12,10,15,0.42));
      }

      .slide-caption {
        position: absolute;
        left: 28px;
        bottom: 26px;
        z-index: 2;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 0.7rem 1rem;
        border-radius: 999px;
        background: rgba(10, 9, 15, 0.42);
        border: 1px solid rgba(255,255,255,0.13);
        backdrop-filter: blur(10px);
        color: white;
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.14em;
      }

      .slide-actions {
        position: absolute;
        right: 24px;
        bottom: 26px;
        z-index: 2;
        display: flex;
        gap: 12px;
      }

      .arrow-btn {
        width: 50px;
        height: 50px;
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.09);
        color: white;
        font-size: 1.5rem;
        cursor: pointer;
        box-shadow: 0 16px 26px rgba(9, 8, 14, 0.2);
      }

      .thumbs {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
        padding-top: 18px;
      }

      .thumb {
        width: 90px;
        height: 90px;
        border: 2px solid transparent;
        border-radius: 20px;
        overflow: hidden;
        background: rgba(255,255,255,0.04);
        cursor: pointer;
        opacity: 0.7;
        transition: transform 0.25s ease, opacity 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      }

      .thumb:hover {
        transform: translateY(-2px) scale(1.02);
      }

      .thumb.active {
        opacity: 1;
        border-color: rgba(255, 154, 205, 0.8);
        box-shadow: 0 10px 20px rgba(255, 110, 180, 0.18);
      }

      .thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .gallery-section {
        padding-top: 64px;
      }

      .section-head {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 24px;
      }

      .section-head h2 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 3.2rem);
        letter-spacing: -0.05em;
        font-family: "Space Grotesk", sans-serif;
      }

      .section-tag {
        font-size: 0.72rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--rose-soft);
        font-weight: 700;
      }

      .polaroid-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 28px 22px;
      }

      .polaroid {
        background: var(--paper);
        padding: 12px 12px 18px;
        box-shadow: 0 18px 28px rgba(9, 7, 11, 0.24), 0 4px 8px rgba(0,0,0,0.08);
        border: 1px solid rgba(28, 20, 24, 0.06);
        border-radius: 8px;
        transform: rotate(var(--rotate));
        transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s ease, filter 0.35s ease;
        filter: contrast(1.05) saturate(1.02);
      }

      .polaroid:hover {
        transform: rotate(0deg) translateY(-7px);
        box-shadow: 0 28px 34px rgba(8, 7, 11, 0.28), 0 8px 12px rgba(0,0,0,0.08);
        filter: contrast(1.08) saturate(1.06);
      }

      .polaroid img {
        width: 100%;
        height: 260px;
        object-fit: cover;
        filter: contrast(1.05) saturate(1.02);
      }

      .polaroid .label {
        margin-top: 14px;
        text-align: center;
        color: #1a171c;
        font-size: 0.8rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-weight: 800;
      }

      .audio-toggle {
        position: fixed;
        right: 22px;
        bottom: 22px;
        z-index: 20;
        width: 54px;
        height: 54px;
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 50%;
        background: linear-gradient(135deg, rgba(17, 12, 18, 0.8), rgba(34, 23, 28, 0.7));
        color: white;
        font-size: 1.2rem;
        box-shadow: 0 18px 36px rgba(11, 8, 14, 0.26), 0 0 24px rgba(255, 122, 170, 0.08);
        cursor: pointer;
        backdrop-filter: blur(12px);
        transition: transform 0.25s ease, box-shadow 0.25s ease;
      }

      .audio-toggle:hover {
        transform: translateY(-2px) scale(1.03);
        box-shadow: 0 20px 40px rgba(11, 8, 14, 0.28), 0 0 26px rgba(255, 122, 170, 0.12);
      }

      @media (max-width: 980px) {
        .slideshow { height: 500px; }
        .polaroid-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }

      @media (max-width: 700px) {
        .nav-links { display: none; }
        .slideshow { height: 420px; }
        .slide-caption { left: 18px; bottom: 18px; }
        .slide-actions { right: 18px; bottom: 18px; }
        .polaroid-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>

    <button class="audio-toggle" id="audioToggle" type="button" aria-label="Couper le son doux">🔇</button>

    <audio id="softAudio" loop preload="auto" muted>
      <source src="Elvis Presley - Can't Help Falling in Love (Lyrics) [MqazV4hbu8E].mp3" type="audio/mpeg" />
    </audio>

    <script>
      const slides = Array.from(document.querySelectorAll('.slide'));
      const thumbs = Array.from(document.querySelectorAll('.thumb'));
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const audioToggle = document.getElementById('audioToggle');
      const softAudio = document.getElementById('softAudio');

      let currentIndex = 0;
      let isAudioOn = true;
      softAudio.volume = 0.18;
      softAudio.muted = false;

      function showSlide(index) {
        currentIndex = (index + slides.length) % slides.length;

        slides.forEach((slide, i) => {
          slide.classList.toggle('active', i === currentIndex);
        });

        thumbs.forEach((thumb, i) => {
          thumb.classList.toggle('active', i === currentIndex);
        });
      }

      async function setAudioState(nextState) {
        isAudioOn = nextState;
        softAudio.muted = !isAudioOn;
        audioToggle.textContent = isAudioOn ? '🔇' : '🔊';
        audioToggle.setAttribute('aria-label', isAudioOn ? 'Couper le son doux' : 'Activer le son doux');

        if (isAudioOn) {
          try {
            softAudio.volume = 0;
            await softAudio.play();
            const start = performance.now();
            const fadeDuration = 1200;

            function fadeIn() {
              const elapsed = performance.now() - start;
              const progress = Math.min(elapsed / fadeDuration, 1);
              softAudio.volume = 0.18 * progress;
              if (progress < 1) {
                requestAnimationFrame(fadeIn);
              }
            }

            requestAnimationFrame(fadeIn);
          } catch (error) {
            console.log('Audio blocked until the user interacts with the page.');
          }
        } else {
          softAudio.pause();
          softAudio.volume = 0.18;
        }
      }

      prevBtn.addEventListener('click', () => showSlide(currentIndex - 1));
      nextBtn.addEventListener('click', () => showSlide(currentIndex + 1));

      thumbs.forEach((thumb) => {
        thumb.addEventListener('click', () => {
          showSlide(Number(thumb.dataset.index));
        });
      });

      document.addEventListener('pointerdown', () => {
        if (!isAudioOn) return;
        setAudioState(true);
      }, { once: true });

      audioToggle.addEventListener('click', async () => {
        await setAudioState(!isAudioOn);
      });

      setAudioState(true);
      setInterval(() => showSlide(currentIndex + 1), 3500);
    </script>
  </body>
